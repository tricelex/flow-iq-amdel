cubes:
  - name: customers
    sql_table: customer
    title: Customers
    description: Customer information for the DVD rental store

    dimensions:
      - name: customer_id
        sql: "{CUBE}.customer_id"
        type: number
        primary_key: true

      - name: first_name
        sql: "{CUBE}.first_name"
        type: string
        title: First Name

      - name: last_name
        sql: "{CUBE}.last_name"
        type: string
        title: Last Name

      - name: full_name
        sql: "CONCAT({CUBE}.first_name, ' ', {CUBE}.last_name)"
        type: string
        title: Full Name

      - name: email
        sql: "{CUBE}.email"
        type: string
        title: Email

      - name: active
        sql: "CASE WHEN {CUBE}.activebool THEN 'Active' ELSE 'Inactive' END"
        type: string
        title: Status

      - name: create_date
        sql: "{CUBE}.create_date"
        type: time
        title: Join Date

    measures:
      - name: count
        type: count
        title: Total Customers

      - name: active_count
        type: count
        title: Active Customers
        filters:
          - sql: "{CUBE}.activebool = true"
