version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: app_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  cube:
    image: cubejs/cube:latest
    container_name: flowiq_cube
    ports:
      - "4000:4000"
    environment:
      # PostgreSQL configuration (local neon_sample database)
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=host.docker.internal
      - CUBEJS_DB_PORT=5433
      - CUBEJS_DB_NAME=neon_sample
      - CUBEJS_DB_USER=postgres
      - CUBEJS_DB_PASS=postgres
      # Cube.js API settings
      - CUBEJS_API_SECRET=${CUBE_API_SECRET:-flowiq-dev-secret-key}
      - CUBEJS_DEV_MODE=true
      - CUBEJS_WEB_SOCKETS=false
      - CUBEJS_TELEMETRY=false
    volumes:
      - ./cube:/cube/conf
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_api
    command: python -m app.api.main
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app
      - HOST=0.0.0.0
      - PORT=8000
      - CUBE_API_URL=http://cube:4000
      - CUBE_API_SECRET=${CUBE_API_SECRET:-flowiq-dev-secret-key}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      cube:
        condition: service_started
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
